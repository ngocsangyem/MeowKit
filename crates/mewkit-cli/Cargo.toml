[package]
name = "mewkit-cli"
description = "The mewkit command line: argument parsing, output and exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# One binary. `mk` and the pre-rename `mewkit-next` are links (copies on Windows) the
# installer and self-update place beside it, not further `[[bin]]` targets: each target
# would compile and ship another full copy.
[[bin]]
name = "mewkit"
path = "src/main.rs"

# The TS-vs-Rust comparison, declared rather than auto-discovered so the target
# name is stable in the one command that runs it:
# `cargo test -p mewkit-cli --test parity -- --include-ignored`.
[[test]]
name = "parity"
path = "tests/parity/main.rs"

[dependencies]
mewkit-core = { path = "../mewkit-core" }
mewkit-adapters = { path = "../mewkit-adapters" }
clap = { version = "4.6.7", features = ["derive"] }
# Terminal pickers. `inquire` over `dialoguer` for three reasons: it reports a
# missing terminal as its own `NotTTY` error (the non-TTY path is a first-class
# outcome rather than a guess from an io error), ESC maps to
# `OperationCanceled` the way `@clack/prompts`'s `isCancel` does, and
# `raw_prompt` returns the chosen INDEX so a label never has to double as the
# answer. Its backend is crossterm, whose default `windows` feature pulls
# `winapi` + `crossterm_winapi` — the Windows CI leg draws on the real console
# API, not a POSIX shim. Default features are off: `fuzzy`, `macros` and
# `one-liners` are convenience only, and the four pickers here need none of them.
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml_edit = "0.25.19"

[lints]
workspace = true

[dev-dependencies]
flate2 = "1.1.11"
# The parity harness normalises away a timestamp, a temp path and a version
# before it compares two CLIs; `regex` is already in the dependency tree
# through mewkit-core, so this adds no new reviewed crate.
regex = "1.13.1"
tar = { version = "0.4", default-features = false }
tempfile = "3.27.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
