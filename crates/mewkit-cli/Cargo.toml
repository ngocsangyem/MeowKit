[package]
name = "mewkit-cli"
description = "The mewkit-next command line: argument parsing, output and exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Named mewkit-next until cutover so it can sit beside the npm `mewkit` CLI.
[[bin]]
name = "mewkit-next"
path = "src/main.rs"

[dependencies]
mewkit-core = { path = "../mewkit-core" }
mewkit-adapters = { path = "../mewkit-adapters" }
clap = { version = "4.6.7", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }
