[package]
name = "mewkit-core"
description = "Runtime-agnostic core of the mewkit installer: no CLI parsing, prompts or process exits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Alphabetical, so a new dependency has one obvious home.
flate2 = "1.1.11"
# The LOCAL calendar date, for the `YYMMDD` stamp `task new` puts in a filename.
# The standard library has no local calendar, and both alternatives were worse:
# `unsafe` for `localtime_r` (this workspace forbids it), or naming the file by
# the UTC date, which disagrees with the npm CLI — and with the user's own
# calendar — for part of every day. Jiff reads the system zone with safe code on
# every platform the CLI ships to (`/etc/localtime` on Unix, the Windows
# time-zone API there), and is `Unlicense OR MIT`, which `cargo deny` accepts.
#
# The features are the minimum for "what day is it here": no `tz-fat` (a
# lookup-speed tradeoff that costs heap for a once-per-command call), no
# `perf-inline`, no `tzdb-concatenated` (Android), no `serde`/`logging`/`static`.
# `tzdb-bundle-platform` is what makes Windows work — it carries the database
# only on platforms that have no system copy, and tz-data updates still arrive
# through `jiff-tzdb`'s own version range rather than through this pin.
#
# Pinned EXACTLY because this crate decides a FILENAME a human reads and a script
# globs: a date that moves should be a deliberate upgrade, not a `cargo update`.
jiff = { version = "=0.2.43", default-features = false, features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
    "tzdb-bundle-platform",
] }
# The memory content scan runs ~50 injection patterns and ~19 secret patterns per
# line. `regex` is linear-time by construction, which is the property the TS port
# had to buy by hand-bounding every quantifier in the email pattern.
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# The general YAML reader (skill frontmatter, workflow specs) — NOT the config
# reader, which stays a hand parser because a dependency-free hook parses the
# same file. Chosen over `serde_yaml` (deprecated since 0.9.34), `serde_yml`
# (RUSTSEC-2025-0068, unsound and unmaintained) and `yaml-rust`
# (RUSTSEC-2024-0320): it is pure Rust, actively released, and advisory-free,
# which `cargo deny` requires. Pinned EXACTLY because it is the least
# established of these dependencies and it replaces js-yaml kit-wide; its
# `granit-parser` dependency comes with it. Full rationale and the YAML
# 1.1-vs-1.2 caveats: `src/yaml_doc.rs`.
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = { version = "0.4", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.19"
# NFKC for the normalize pass of the injection scan (homoglyph folding). A UAX#15
# decomposition table is not something to hand-roll.
unicode-normalization = "0.1.26"
ureq = "3.5.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
