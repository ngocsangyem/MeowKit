[package]
name = "mewkit-core"
description = "Runtime-agnostic core of the mewkit installer: no CLI parsing, prompts or process exits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml_edit = "0.25.19"
ureq = "3.5.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
proptest = "1.12.0"
