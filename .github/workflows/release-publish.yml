name: Release publish

# The writing half of a release, run after release.yml in the same workflow run (it reuses
# that run's artifacts): publish `mewkit-v<version>` (binaries, never latest), then
# `v<version>` (kit zip; latest only for a stable), and for a stable open the installer pin
# PR into main. A failed step publishes nothing after it; published assets are never replaced.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      ref:
        description: Commit SHA to release
        type: string
        required: true
      title:
        type: string
        required: true
      notes:
        description: Release notes (Markdown) for the kit release
        type: string
        required: true
    secrets:
      RELEASE_PR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  publish-binary:
    name: Publish mewkit-v${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      # A beta and a stable run in separate queues; a beta planned before its stable shipped
      # must not be published after it.
      - name: A beta must not follow its own stable
        if: contains(inputs.version, '-')
        run: |
          base="${VERSION%%-*}"
          if git ls-remote --exit-code --tags origin "refs/tags/v$base" >/dev/null; then
            echo "::error::v$base is already released; beta $VERSION is obsolete and is not published"; exit 1
          fi

      # Only reviewed commits are published: the release commit must be on main or develop.
      - name: Release commit must be on main or develop
        run: |
          git fetch --no-tags origin main develop || git fetch --no-tags origin main
          for b in main develop; do
            git rev-parse -q --verify "origin/$b" >/dev/null && git merge-base --is-ancestor "$SHA" "origin/$b" && exit 0
          done
          echo "::error::$SHA is on neither main nor develop"; exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: mewkit-*
          merge-multiple: true

      - name: Build binary-manifest.json and checksums.txt
        env:
          # Raise to withdraw older versions (self-update then tells their users to move on).
          MIN_SUPPORTED: ${{ vars.MEWKIT_MIN_SUPPORTED }}
        run: |
          node scripts/release/build-binary-manifest.mjs --version "$VERSION" --dir dist \
            ${MIN_SUPPORTED:+--min-supported "$MIN_SUPPORTED"}
          if find dist -iname '*.zip' | grep -q .; then echo "::error::a binary release must carry no .zip"; exit 1; fi

      # Signed statement that these exact archives were built by this workflow run
      # (`gh attestation verify <archive> --repo <owner>/<repo>`). It runs before the release
      # is created, so an archive that cannot be attested is never published.
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mewkit-*.tar.gz

      - name: Create the binary release (never marked latest)
        run: |
          tag="mewkit-v$VERSION"
          state=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null || echo missing)
          if [ "$state" = false ]; then
            echo "$tag is already published; releases are immutable, leaving it."; exit 0
          fi
          # A draft left by a failed run is mutable: replace it with this run's archives.
          [ "$state" = true ] && gh release delete "$tag" --yes
          # shellcheck disable=SC2016 # the backticks are Markdown inside a JS template string
          notes=$(node -e '
            const m = require("./dist/binary-manifest.json");
            const rows = Object.entries(m.targets).map(([t, a]) => `| ${t} | ${(a.size / 1048576).toFixed(1)} MiB | \`${a.sha256}\` |`);
            console.log([
              `mewkit ${m.version} (${m.channel}), released with kit v${m.version}. Update: \`mewkit self-update\`.`,
              "", "| Target | Archive size | SHA-256 |", "| --- | --- | --- |", ...rows,
            ].join("\n"));
          ')
          prerelease=; case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          # Draft first: the release becomes visible only once every asset is uploaded.
          gh release create "$tag" --draft --target "$SHA" --latest=false $prerelease \
            --title "mewkit $VERSION" --notes "$notes" \
            dist/mewkit-*.tar.gz dist/checksums.txt dist/binary-manifest.json
          gh release edit "$tag" --draft=false --latest=false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-manifest
          path: dist/binary-manifest.json

  publish-kit:
    name: Publish v${{ inputs.version }}
    needs: publish-binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kit-dist
          path: dist
      - name: Publish the kit release
        env:
          TITLE: ${{ inputs.title }}
          NOTES: ${{ inputs.notes }}
          SHA: ${{ inputs.ref }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          bash scripts/release/publish-kit.sh "$VERSION" "$TITLE" "$RUNNER_TEMP/notes.md" "$SHA"

  pin-installers:
    name: Open the installer pin pull request
    # install.sh / install.ps1 on main serve the stable binary only.
    if: ${{ !contains(inputs.version, '-') }}
    needs: publish-kit
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ inputs.version }}
      BASE: main
      # A pull request opened with the default token triggers no CI. With RELEASE_PR_TOKEN
      # (fine-grained: contents + pull requests write) the pin PR runs its checks.
      GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binary-manifest
          path: dist
      - name: Re-render install.sh and install.ps1 and open a pull request
        run: |
          node scripts/release/render-installers.mjs --manifest dist/binary-manifest.json
          branch="release/installer-pins-mewkit-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add install.sh install.ps1 scripts/release/installer-pins.json
          git commit -m "build(release): pin installers to mewkit $VERSION"
          # A rerun replaces its own pin branch and reuses its PR.
          git push --force origin "$branch"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "pin PR for $branch already open"; exit 0
          fi
          title="build(release): pin installers to mewkit $VERSION"
          body="Pins install.sh and install.ps1 to the archives of mewkit-v$VERSION (URL, SHA-256 and size from its binary-manifest.json). Compare each digest with the release's checksums.txt before merging: merging is what makes the installers serve this version."
          if out=$(gh pr create --base "$BASE" --head "$branch" --title "$title" --body "$body" 2>&1); then
            echo "$out"; exit 0
          fi
          # Without RELEASE_PR_TOKEN, a repository that does not let GitHub Actions create
          # pull requests refuses this one. The branch is pushed, so report the link instead
          # of failing a release that already published.
          if grep -q "not permitted to create or approve pull requests" <<<"$out"; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$branch?expand=1"
            echo "::notice title=Open the installer pin PR by hand::$url"
            echo "### Installer pin PR not opened: [open it]($url) after checking each digest against checksums.txt." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "$out" >&2
          exit 1
