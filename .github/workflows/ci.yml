name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so diff-mode lints can resolve a base ref (merge-base).
          fetch-depth: 0

      # pnpm before setup-node so the pnpm store cache can resolve. Version comes
      # from the root package.json packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate visual-plan eval fixtures
        run: node scripts/validate-visual-plan-evals.cjs

      - name: Worktree command contract tests
        run: node .claude/skills/worktree/scripts/worktree.test.cjs

      - name: Sequential-thinking script tests
        run: bash .claude/skills/sequential-thinking/scripts/test-scripts.sh

      - name: Cook gate contract tests
        run: bash .claude/skills/cook/scripts/test-scripts.sh

      - name: Fix skill contract tests
        run: bash tests/fix-skill-contract.test.sh

      - name: Docs-finder offline tests
        run: node .claude/skills/docs-finder/scripts/tests/run-tests.js

      - name: Intake ticket sanitizer tests
        run: node .claude/skills/intake/scripts/sanitize-ticket.test.cjs

      - name: Prompt-enhancer canary runner tests
        run: node .claude/skills/prompt-enhancer/eval/run-canaries.test.cjs

      - name: Validate rubric schemas and presets
        run: bash .claude/skills/rubric/scripts/validate-rubric.sh

      - name: Hook-registration drift test
        run: bash tests/check-hook-registration.test.sh

      - name: Changed-files lint severity test
        run: bash tests/changed-files-lint.test.sh

      - name: Surface contract test
        run: bash tests/surface-contract.test.sh

      - name: Git index audit test
        run: bash tests/git-index-audit.test.sh

      - name: mk:help skill contract test
        run: bash tests/help-skill-contract.test.sh

      - name: Lint the committed team-memory store
        # Bounded: the lint reads user-pasted content, so a pathological line must fail the
        # step rather than burn toward the 6-hour job ceiling.
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # This repo's own store (may be absent — that is a legitimate PASS).
          node packages/mewkit/dist/index.js validate --memory
          # A store with REAL entries, so the step is not vacuous. Copied to a temp project
          # root (and git-init'd, since the root resolver keys off the VCS root) because the
          # fixture lives inside this repo and would otherwise resolve to the repo root.
          fixture_root="$(mktemp -d)"
          cp -R tests/fixtures/memory-store/. "$fixture_root/"
          git -C "$fixture_root" init -q .
          ( cd "$fixture_root" && node "$GITHUB_WORKSPACE/packages/mewkit/dist/index.js" validate --memory )

      - name: Zero-residue check (memory/wiki)
        run: node scripts/check-memory-wiki-residue.cjs

      # Each Python-owning skill gets its OWN environment from its OWN pinned
      # requirements. No shared environment and no blanket install: a package one
      # skill pins must not become every skill's dependency, and a step that
      # passed only because another step installed something is a step that lies.
      - name: Multimodal mock tests
        run: |
          node packages/mewkit/dist/index.js skill env multimodal
          node .claude/hooks/lib/skill-python.cjs .claude/skills/multimodal/scripts/tests/run_tests.py

      - name: Validate Figma evidence packet fixtures
        run: |
          node packages/mewkit/dist/index.js skill env figma
          node .claude/hooks/lib/skill-python.cjs .claude/skills/figma/evals/validate-evidence-packets.py

      - name: Test web-to-markdown URL SSRF guard
        run: |
          node packages/mewkit/dist/index.js skill env web-to-markdown
          node .claude/hooks/lib/skill-python.cjs --skill web-to-markdown -m pytest \
            .claude/skills/web-to-markdown/tests/test_safe_url.py \
            .claude/skills/web-to-markdown/tests/test_e2e_offline.py -q

      - name: Validate plan-creator compatibility fixtures
        run: bash tests/fixtures/plan-creator/validate-fixtures.sh

      - name: Validate skill-creator fixtures
        run: |
          node packages/mewkit/dist/index.js skill env skill-creator
          bash tests/fixtures/skill-creator/validate-fixtures.sh

      - name: Story-sizer deterministic tests
        run: bash tests/story-sizer-all.test.sh

      - name: Routing eval (Track D, EN + VI)
        run: |
          node packages/mewkit/dist/index.js skill env scale-routing
          node .claude/hooks/lib/skill-python.cjs .claude/skills/scale-routing/eval/run-routing-eval.py

      - name: Critical-skill contract coverage suites
        run: bash tests/skill-contract-coverage.test.sh

      # Repo-development tooling: no skill owns it, so it runs on the runner's own
      # interpreter and never inside a skill environment.
      - name: Real-world journey specs frozen + valid
        run: python3 tests/journey-validation/check-journey-specs.py

      - name: Validate skill cross-refs
        run: bash scripts/check-skill-cross-refs.sh

      # Skills reach their own files without `.claude/`, every other kit reference has a
      # declared class and resolves to a shipped file, and every tool name is in the table.
      - name: Check skills are portable across runtimes
        run: node scripts/check-skills-portable.cjs

      - name: Own-skill path rewrite has nothing left to change
        run: node scripts/rewrite-own-skill-paths.cjs --check

      - name: Validate hook registration
        run: bash scripts/check-hook-registration.sh

      - name: Validate workflow spec drift
        run: node packages/mewkit/dist/index.js validate --workflow

      - name: Validate gate-authority contract
        run: node packages/mewkit/dist/index.js validate --gates

      # plugin/ is generated from .claude/. Regenerate into a scratch dir and
      # diff: catches both a forgotten regenerate (plugin ships stale behavior)
      # and a hand-edit (the next build silently discards it).
      - name: Validate plugin parity
        run: node packages/mewkit/dist/index.js validate --parity

      - name: Validate artifact ownership metadata
        run: node packages/mewkit/dist/index.js validate --ownership

      - name: Validate declared agent contracts
        run: node packages/mewkit/dist/index.js validate --agents

      - name: Validate pack manifest coherence + safety invariant
        run: node packages/mewkit/dist/index.js validate --packs

      # Structural Codex compatibility canary: install the authored bundle via
      # `init --target codex` into a temp dir and run structural validation on the
      # RESULT. No Codex CLI in CI, so the live execpolicy/version checks skip
      # gracefully; the structural proof is blocking (a broken bundle fails here).
      - name: Codex bundle compatibility lane (structural)
        run: node packages/mewkit/scripts/codex-compat-check.mjs

      - name: Validate responsibility substrate (tagging + view drift)
        run: node packages/mewkit/dist/index.js validate --substrate

      - name: Validate plugin namespace + manifest contract
        run: node packages/mewkit/dist/index.js validate --plugin

      # One budget number: the always-on rule set a session loads on every turn. The old
      # 131000-token core guardrail was never enforced (it blocked every run instead of
      # catching growth) and is replaced by this hard byte budget. Measure the wider core
      # profile on demand with `mewkit budget context --profile core`.
      - name: Check always-on rule budget
        run: node scripts/check-always-on-budget.cjs .

      - name: Check always-on safety text survives compression
        run: node scripts/check-rule-survival.cjs .

      - name: Check for dangling references to relocated rules
        run: node scripts/check-dangling-rule-refs.cjs .

      # Every environment name the shipped kit reads is classified in
      # env-name-classification.json, which the check loads as its allowlist
      # rather than restating. Catches both a literal read and a name composed
      # from a prefix and a suffix literal, which a literal scan cannot see.
      - name: Check environment-name reads are classified
        run: node scripts/check-env-reads.cjs

      - name: Check the published config schema is not stale
        run: node scripts/generate-config-schema.cjs --check

      # A `mewkit <verb>` a skill tells an agent to run must exist. A renamed or
      # never-shipped verb fails mid-session, inside a workflow the agent cannot
      # finish; the catalogue is the source, so this cannot go stale.
      - name: Check every mewkit verb the kit names resolves
        run: node scripts/check-kit-verbs.cjs

      # The agent-facing CLI reference is generated from the same catalogue the dispatcher
      # reads, so a surface change that skips regeneration is a stale instruction shipped
      # to every project.
      - name: Generated CLI reference matches the command catalogue
        run: node scripts/generate-cli-manual.cjs --check

      - name: Validate README, website, and index counts (stale-index)
        run: node scripts/harness-inventory.cjs --check

      - name: Verify high-traffic dependency metadata
        run: node scripts/scan-skill-dependency-edges.mjs --check-high-traffic

      - name: Report generic-core provider vocabulary baseline
        run: node scripts/core-skill-token-baseline.cjs

      - name: Lint website terminology
        run: node scripts/terminology-linter.cjs

      - name: Validate skill frontmatter
        run: node packages/mewkit/dist/index.js validate --frontmatter

      - name: Validate docs references on Type-1 allowlist
        run: node packages/mewkit/dist/index.js validate --docs-refs

      - name: Validate rule availability
        run: bash scripts/validate-rule-availability.sh

      - name: Check the shared executables need node only
        run: node scripts/check-node-only-runtime.cjs .

      # Diff-mode brand-prose lint: violations in PR-changed files fail; pre-existing
      # legacy violations in untouched files are WARN-only. Needs a base ref — resolve
      # it from the PR base branch (guarded to PR events that set GITHUB_BASE_REF).
      - name: Resolve lint base ref
        if: github.base_ref != ''
        run: |
          git fetch --no-tags origin "$GITHUB_BASE_REF" || true
          BASE="$(git merge-base "origin/$GITHUB_BASE_REF" HEAD 2>/dev/null || true)"
          if [ -n "$BASE" ]; then echo "LINT_BASE_REF=$BASE" >> "$GITHUB_ENV"; fi

      - name: Lint brand prose in changed .claude markdown (diff mode)
        run: LINT_MODE=diff bash scripts/lint-brand-prose.sh

      - name: "Reject residual meow: namespace"
        run: |
          if grep -rEn '^name:[[:space:]]*meow:' .claude/skills/*/SKILL.md; then
            echo "ERROR: legacy 'meow:' frontmatter found — use 'mk:' instead." >&2
            exit 1
          fi
          if grep -rEn '/meow:[a-z]' .claude/skills/ .claude/rules/ CLAUDE.md 2>/dev/null; then
            echo "ERROR: legacy '/meow:' slash references found — use '/mk:' instead." >&2
            exit 1
          fi

      - name: Hook regression tests
        run: node --test .claude/hooks/__tests__/*.test.cjs

      - name: Generate skill evaluation results
        run: node scripts/generate-eval-results.cjs "$RUNNER_TEMP/skill-eval-results.md"

      - name: Publish skill evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: skill-eval-results
          path: ${{ runner.temp }}/skill-eval-results.md
          if-no-files-found: error

  # The docs site has its own gate. Both checks resolve against the live `.claude/` tree
  # in the same checkout, so a runtime change that invalidates a documented path, env var,
  # or model id fails here instead of reaching a reader.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck docs
        run: npm run typecheck -w packages/docs

      # Honest drift detection needs the manifest re-derived against the live `.claude/` tree,
      # so this job builds the generator rather than trusting the committed JSON.
      - name: Build the CLI (the docs manifest generator)
        run: npm run build -w packages/mewkit

      - name: Docs reference manifest and pages match the runtime
        run: node scripts/docs-manifest.cjs --check

      - name: Frontmatter contract holds
        run: npm run check:frontmatter -w packages/docs

      - name: Internal links resolve to real pages
        run: npm run check:links -w packages/docs

      - name: Every page is in the sidebar or redirected
        run: npm run check:nav -w packages/docs

      - name: No stale runtime values in docs
        run: npm run check:stale -w packages/docs

      - name: Learning-path prose passes the stop-slop hard tier
        run: npm run check:slop -w packages/docs

      - name: Every skill and agent has a reference page
        run: npm run check:coverage -w packages/docs

      - name: Build docs site
        run: npm run build -w packages/docs

  # Windows is a supported Codex target (user decision). This job proves the authored
  # bundle installs and structurally validates on windows-latest — the authored hook
  # commands carry a `commandWindows` variant, so the install must not assume a POSIX
  # shell. Node-only steps (no bash) keep the job cross-platform. Codex CLI is absent,
  # so the canary's live checks skip; the structural install + validate is the proof.
  codex-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm before setup-node so the pnpm store cache can resolve. Version comes
      # from the root package.json packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npm run build

      - name: Codex bundle structural canary (Windows)
        run: node packages/mewkit/scripts/codex-compat-check.mjs

      - name: Codex bundle parity + version-support unit tests
        run: npx vitest run packages/mewkit/src/migrate/modules/codex/__tests__/packaged-bundle-parity.test.ts packages/mewkit/src/migrate/hooks/__tests__/codex-version-support.test.ts

  # The hook runtime is node-only, which is only worth anything if it runs where
  # there is no POSIX shell. This job proves that on the one host that can: the
  # hook suites, the node-native hook tests, and doctor with its hard-gate probes
  # actually executing rather than skipping. Every step is node, no bash.
  hooks-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: npm run build

      - name: Hook suites (golden replay, crash paths, dispatcher, isolation, env allowlist)
        run: npx vitest run tests/hooks

      - name: Node-native hook tests
        run: node --test .claude/hooks/__tests__/*.test.cjs

      # The hard-gate probes used to be skipped on this platform because the hooks
      # were POSIX shell. They are node now, so a skip here would mean the only
      # thing this port exists for is never verified.
      - name: Doctor hard gates
        run: node packages/mewkit/dist/index.js doctor --hard-gates
