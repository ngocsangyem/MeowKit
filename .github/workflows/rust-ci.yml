name: Rust CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      # The CLI's tests run the shipped hooks, so a hook change must re-run them.
      - ".claude/hooks/**"
      # `review prepare` and `review cleanup` exec the kit's worktree action.
      - ".claude/skills/worktree/scripts/**"
      - ".github/workflows/rust-release.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      # The CLI's tests run the shipped hooks, so a hook change must re-run them.
      - ".claude/hooks/**"
      # `review prepare` and `review cleanup` exec the kit's worktree action.
      - ".claude/skills/worktree/scripts/**"
      - ".github/workflows/rust-release.yml"

env:
  CARGO_TERM_COLOR: always
  # Fail on any rustc warning, not only clippy's.
  RUSTFLAGS: -D warnings

# Pull-request checks only read the repository; nothing here publishes or comments.
permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # rustup reads rust-toolchain.toml and installs the pinned channel with
      # rustfmt and clippy on first use.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # `tests/reader_agreement.rs` runs the shipped `.cjs` config reader under
      # Node and compares it to this crate, fixture by fixture. It FAILS when
      # Node is absent rather than skipping, so the runtime is requested
      # explicitly instead of relying on whatever the runner image preinstalls.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check advisories bans licenses sources
