name: Rust CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/rust-release.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      - ".github/workflows/rust-release.yml"

env:
  CARGO_TERM_COLOR: always
  # Fail on any rustc warning, not only clippy's.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # rustup reads rust-toolchain.toml and installs the pinned channel with
      # rustfmt and clippy on first use.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
