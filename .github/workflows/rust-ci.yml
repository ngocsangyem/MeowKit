name: Rust CI

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      # The CLI's tests package these paths as the kit (`ARCHIVE_ROOTS` in
      # crates/mewkit-adapters/tests/support/mod.rs), so a kit-only change
      # must re-run them. Keep this list in step with that one.
      - ".claude/**"
      - ".meowkit/.env.example"
      - ".meowkit/gitignore.meowkit"
      - ".meowkit/harness-inventory.json"
      - ".meowkit/mcp.json.example"
      - ".meowkit/pack-manifest.json"
      - "kit/overlays/**"
      - ".github/workflows/rust-release.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deny.toml"
      - "scripts/release/**"
      - "install.sh"
      - "install.ps1"
      - ".github/workflows/rust-ci.yml"
      # The CLI's tests package these paths as the kit (`ARCHIVE_ROOTS` in
      # crates/mewkit-adapters/tests/support/mod.rs), so a kit-only change
      # must re-run them. Keep this list in step with that one.
      - ".claude/**"
      - ".meowkit/.env.example"
      - ".meowkit/gitignore.meowkit"
      - ".meowkit/harness-inventory.json"
      - ".meowkit/mcp.json.example"
      - ".meowkit/pack-manifest.json"
      - "kit/overlays/**"
      - ".github/workflows/rust-release.yml"

env:
  CARGO_TERM_COLOR: always
  # Fail on any rustc warning, not only clippy's.
  RUSTFLAGS: -D warnings

# Pull-request checks only read the repository; nothing here publishes or comments.
permissions:
  contents: read

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }}${{ matrix.shards > 1 && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the suite several times slower than Linux on the same
        # tests, so its tests are split across machines; nextest's `slice`
        # partition deals every test out round-robin across the shards.
        include:
          - { os: ubuntu-latest, shard: 1, shards: 1 }
          - { os: macos-latest, shard: 1, shards: 1 }
          - { os: windows-latest, shard: 1, shards: 3 }
          - { os: windows-latest, shard: 2, shards: 3 }
          - { os: windows-latest, shard: 3, shards: 3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup reads rust-toolchain.toml and installs the pinned channel with
      # rustfmt and clippy on first use.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The tests write every scratch project under the OS temp dir. On a
      # Windows runner that is C:\Users\...\Temp, and a probe there measured
      # 1,000 small files with a flush each at 5.7 s against 0.4 s on D:, the
      # drive that holds RUNNER_TEMP; one lifecycle pair test took 31 s against
      # 9.6 s. Rust's temp_dir() reads TMP first, then TEMP.
      - name: Put the temp dir on the runner's work drive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # `tests/reader_agreement.rs` runs the shipped `.cjs` config reader under
      # Node and compares it to this crate, fixture by fixture. It FAILS when
      # Node is absent rather than skipping, so the runtime is requested
      # explicitly instead of relying on whatever the runner image preinstalls.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # nextest runs tests from every binary at once, where `cargo test` runs
      # one binary after another, and it can split the tests across shards.
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: nextest@0.9

      - name: Format
        if: matrix.shard == 1
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.shard == 1
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: >-
          cargo nextest run --workspace --locked --no-fail-fast
          --partition slice:${{ matrix.shard }}/${{ matrix.shards }}

      # nextest does not run doctests; they are platform-independent.
      - name: Doctests
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --workspace --doc --locked

  deny:
    name: cargo-deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2
        with:
          command: check advisories bans licenses sources
