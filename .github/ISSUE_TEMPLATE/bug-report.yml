name: Bug Report
description: Report a bug in the MeowKit kit or the mewkit CLI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in the sections below so it can be reproduced.
        Security problem? Do not open a public issue; contact the maintainer privately.

  - type: input
    id: binary-version
    attributes:
      label: mewkit version
      description: "Output of `mewkit --version`"
      placeholder: "mewkit 0.1.1"
    validations:
      required: true

  - type: textarea
    id: kit-version
    attributes:
      label: Kit version
      description: "Output of `mewkit versions` in the project"
      render: shell
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      description: Which runtime were you using? Pick all that are installed in the project.
      multiple: true
      options:
        - Claude Code
        - Codex
        - Cursor
        - Grok
        - Pi
        - OMP
        - Not runtime-specific (CLI only)
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: "Claude Code 2.x"

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - "CLI: init / upgrade / uninstall"
        - "CLI: doctor / validate / other command"
        - "CLI: install.sh / install.ps1 / self-update"
        - Skill (mk:*)
        - Agent
        - Rule
        - Hook (ship check, credential guard, other)
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: "After `mewkit upgrade`, files the new kit dropped were still in .claude/..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands that shows the bug.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Output
      description: "Command output, and `mewkit doctor` output if relevant. Remove secrets first."
      render: shell

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Windows (WSL)
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: "Hooks run on Node.js 24+. Output of `node --version`"
      placeholder: "v24.x"
