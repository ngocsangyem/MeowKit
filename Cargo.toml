[workspace]
resolver = "3"
members = ["crates/mewkit-core", "crates/mewkit-adapters", "crates/mewkit-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Pinned to the toolchain in rust-toolchain.toml: the only version CI proves.
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ngocsangyem/MeowKit"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The published binaries: one optimised, stripped static artifact per target.
[profile.release]
lto = true
codegen-units = 1
strip = true
