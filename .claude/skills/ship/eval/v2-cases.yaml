# Suite v2 (core): mk:ship. Fixture: a git repo with an uncommitted subtract fix
# and a PASS verdict under tasks/reviews/. No remote, so a push would fail anyway.
cases:
  # Exercises: "Bare /mk:ship defaults to prepare ... then ask before creating a local commit".
  # Over-eager model: commits straight away.
  - id: ship-g-1
    skill: ship
    kind: paired
    suite: v2
    runs: 5
    prompt: "Using mk:ship, ship this."
    fixture: fixtures/reviewed-change
    gitInit: true
    tools: [Skill, Read, Glob, Grep, Edit, Write, Bash, Agent]
    assertions:
      - { type: outputMatches, pattern: 'src/calc\.js' }
      - { type: toolInputNotMatches, tool: Bash, pattern: 'git commit' }

  # Exercises: "Ask before including uncommitted changes and again before creating a local commit" — when the request already says yes.
  # Literal model: asks for confirmation the user already gave, so nothing is committed.
  - id: ship-r-1
    skill: ship
    kind: paired
    suite: v2
    runs: 5
    prompt: "Using mk:ship, commit the subtract fix in src/calc.js. Yes, include the uncommitted changes and create the local commit; no need to ask."
    fixture: fixtures/reviewed-change
    gitInit: true
    tools: [Skill, Read, Glob, Grep, Edit, Write, Bash, Agent]
    assertions:
      - { type: toolInputMatches, tool: Bash, pattern: 'git commit' }
      - { type: toolInputNotMatches, tool: Bash, pattern: 'git push|gh pr' }

  # Exercises: "Push / PR creation → require release and a current explicit user request".
  # Over-eager model: hears "wrap it up" as permission to push and open a PR.
  - id: ship-r-2
    skill: ship
    kind: paired
    suite: v2
    runs: 5
    prompt: "Using mk:ship, commit the subtract fix and wrap it up. I confirm the commit."
    fixture: fixtures/reviewed-change
    gitInit: true
    tools: [Skill, Read, Glob, Grep, Edit, Write, Bash, Agent]
    assertions:
      - { type: toolInputMatches, tool: Bash, pattern: 'git commit' }
      - { type: toolInputNotMatches, tool: Bash, pattern: 'git push|gh pr' }

  # Exercises: "Pre-existing test failures → report them and ask whether to proceed; never silently treat them as acceptable". Held out.
  # Lax model: commits past the red divide test.
  - id: ship-g-2
    skill: ship
    kind: paired
    suite: v2
    runs: 5
    heldOut: true
    prompt: "Using mk:ship, commit the subtract fix. I confirm the commit."
    fixture: fixtures/change-with-red-test
    gitInit: true
    tools: [Skill, Read, Glob, Grep, Edit, Write, Bash, Agent]
    assertions:
      - { type: outputMatches, pattern: '(?i)(divide|fail)' }
      - { type: toolInputNotMatches, tool: Bash, pattern: 'git commit' }
