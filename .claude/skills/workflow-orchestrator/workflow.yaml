---
# Canonical workflow specification for the MeowKit 7-phase lifecycle.
#
# This file is the single source of truth for phase names, leads and
# required-output path patterns. All prose files that describe the lifecycle
# point here and agree with it.
#
# Drift-check: parses this file and greps the prose files listed under
# `sources:` for any required-output token that appears under a different phase
# than declared here. CI fails on contradiction.
#
# No hook reads these outputs: planning and review are practices, and the one enforced
# ship-time control is the pre-ship hook (lint, related tests, type-check).
version: 1

phases:
  - id: 0
    name: Orient
    lead: mk:agent-detector
    transition: auto
    required_outputs: []
    note: >
      Runs at session start. Detects model tier, execution mode, TDD mode,
      and risk flags. Produces agent assignment for Phase 1.

  - id: 1
    name: Plan
    lead: mk:plan-creator
    required_outputs:
      - "tasks/plans/*/plan.md"
    note: The plan is agreed with the user before Build; nothing blocks an edit without one.

  - id: 2
    name: Test
    lead: mk:testing
    transition: auto
    required_outputs: []
    note: >
      TDD mode (--tdd / MEOWKIT_TDD=1): RED-phase tests written before Phase 3.
      Default mode: optional; Phase 1 may transition directly to Phase 3.

  - id: 3
    name: Build
    lead: mk:cook
    transition: auto
    required_outputs: []
    substeps:
      - id: "3.5"
        name: Simplify
        lead: mk:simplify
        mandatory: true
        note: Run after Phase 3 GREEN, before Verify. Never skip.
      - id: "3.6"
        name: Verify
        lead: mk:verify
        mandatory: true
        note: Unified build+lint+typecheck+test+coverage check. FAIL sends back to Build.

  - id: 4
    name: Review
    lead: mk:review
    required_outputs:
      - "tasks/reviews/*-verdict.md"

  - id: 5
    name: Ship
    lead: mk:ship
    transition: auto
    required_outputs: []

  - id: 6
    name: Reflect
    # Canonical lead list is the union across all lifecycle prose files:
    # analyst + documenter + mk:memory (each mandatory; all three must run).
    leads:
      - analyst
      - documenter
      - mk:memory
    transition: auto
    required_outputs: []


# autobuild sprint-contract substep (autobuild-only; not part of the 7 lifecycle phases).
# This is an internal stage of the autobuild pipeline, not a lifecycle phase.
contract_substep:
  # A document the developer reads before source edits; no hook checks it.
  required_output: "tasks/contracts/*-{slug}-sprint-*.md"

# Prose lifecycle files that the drift-check will scan.
# Paths are relative to the MeowKit project root (the parent of .claude/),
# which is the working directory the validate command runs from.
# Each file must contain a "Canonical source: workflow.yaml" pointer.
# The always-on core rule carries the lifecycle line and is the always-loaded
# lifecycle source.
sources:
  - path: .claude/rules/meowkit-core.md
    lifecycle_render: true
  - path: .claude/skills/cook/references/phase-contracts.md
    lifecycle_render: true
  - path: .claude/skills/workflow-orchestrator/SKILL.md
    lifecycle_render: false
  - path: .claude/skills/workflow-orchestrator/references/workflow-phases.md
    lifecycle_render: true
  - path: .claude/skills/cook/SKILL.md
    lifecycle_render: true
