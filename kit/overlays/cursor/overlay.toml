# Cursor keys the authored kit cannot be projected into.
# Format: crates/mewkit-adapters/src/projection/overlay.rs.

# The main session routes work on this runtime; it loads no orchestrator agent.
omit = [".cursor/agents/orchestrator.md"]

# Cursor loads a skill with `disable-model-invocation` only when the user names it.

[skill.cook]
disable-model-invocation = true

[skill.docs-init]
disable-model-invocation = true

[skill.document-release]
disable-model-invocation = true

